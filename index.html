<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vòng Quay May Mắn</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background: radial-gradient(circle at center, #1e1b4b 0%, #090d16 100%);
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        h1 {
            position: absolute;
            top: 30px;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            background: linear-gradient(90deg, #facc15, #f97316, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 20px rgba(250, 204, 21, 0.2);
        }

        /* Khu vực hiển thị số quay */
        .wheel-container {
            position: relative;
            width: 300px;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 40px;
        }

        .number-display {
            font-size: 9rem;
            font-weight: 900;
            color: #facc15;
            text-shadow: 0 0 30px rgba(250, 204, 21, 0.6);
            transition: transform 0.2s;
        }

        .spinning-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 8px dashed rgba(250, 204, 21, 0.3);
            pointer-events: none;
        }

        .spinning-ring.active {
            animation: spinRing 1s linear infinite;
            border-color: #facc15;
        }

        @keyframes spinRing {
            100% { transform: rotate(360deg); }
        }

        /* Nút bấm */
        .controls {
            display: flex;
            gap: 15px;
            z-index: 10;
        }

        button {
            padding: 16px 45px;
            font-size: 1.3rem;
            font-weight: bold;
            text-transform: uppercase;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        #spinBtn {
            background: linear-gradient(135deg, #facc15 0%, #ea580c 100%);
            color: #111827;
        }

        #spinBtn:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 15px 30px rgba(234, 88, 12, 0.4);
        }

        #spinBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #resetBtn {
            background: rgba(255, 255, 255, 0.1);
            color: #9ca3af;
            font-size: 0.9rem;
            padding: 10px 20px;
            position: absolute;
            bottom: 20px;
            right: 20px;
        }

        #resetBtn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .status-text {
            margin-top: 15px;
            color: #94a3b8;
            font-size: 1rem;
        }

        /* Màn hình Overlay khi trúng số */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(9, 13, 22, 0.9);
            backdrop-filter: blur(8px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .overlay.show {
            display: flex;
            animation: fadeIn 0.3s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Hình tròn chứa số ở chính giữa màn hình */
        .winning-circle {
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #fde047, #f59e0b, #b45309);
            box-shadow: 0 0 60px rgba(245, 158, 11, 0.8), inset 0 0 20px rgba(255, 255, 255, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            transition: transform 0.2s;
        }

        .winning-circle:hover {
            transform: scale(1.05);
        }

        .winning-number {
            font-size: 10rem;
            font-weight: 900;
            color: #1e1b4b;
            line-height: 1;
        }

        .click-hint {
            margin-top: 25px;
            font-size: 1.2rem;
            color: #fde047;
            animation: pulse 1.5s infinite;
            letter-spacing: 1px;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        /* Hiệu ứng lắc lư mạnh khi ấn vào số */
        .wobble-effect {
            animation: intenseWobble 0.7s ease-in-out forwards;
        }

        @keyframes intenseWobble {
            0% { transform: rotate(0deg) scale(1); }
            15% { transform: rotate(-18deg) scale(1.1); }
            30% { transform: rotate(16deg) scale(1.15); }
            45% { transform: rotate(-14deg) scale(1.2); }
            60% { transform: rotate(12deg) scale(1.25); }
            75% { transform: rotate(-8deg) scale(1.3); }
            90% { transform: rotate(5deg) scale(1.35); }
            100% { transform: rotate(0deg) scale(0); opacity: 0; }
        }

        /* Hộp hiển thị món quà sau khi nổ */
        .gift-reveal {
            display: none;
            flex-direction: column;
            align-items: center;
            text-align: center;
            max-width: 90%;
            z-index: 105;
        }

        .gift-reveal.show {
            display: flex;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0.2); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .gift-image {
            width: 340px;
            height: 340px;
            object-fit: cover;
            border-radius: 24px;
            border: 6px solid #facc15;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 40px rgba(250, 204, 21, 0.4);
            background: #1e293b;
            margin-bottom: 20px;
        }

        .gift-title {
            font-size: 2rem;
            font-weight: bold;
            color: #facc15;
            margin-bottom: 25px;
        }

        .close-gift-btn {
            background: #22c55e;
            color: #fff;
            padding: 12px 35px;
            font-size: 1.1rem;
        }

        .close-gift-btn:hover {
            background: #16a34a;
            transform: scale(1.05);
        }

        /* Canvas cho hiệu ứng pháo hoa/nổ */
        #explosionCanvas {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 102;
        }
    </style>
</head>
<body>

    <h1>Vòng Quay Quà Tặng</h1>

    <div class="wheel-container">
        <div class="spinning-ring" id="spinRing"></div>
        <div class="number-display" id="numberDisplay">?</div>
    </div>

    <div class="controls">
        <button id="spinBtn">QUAY SỐ</button>
    </div>
    <div class="status-text" id="statusText">Còn lại: 25 / 25 phần quà</div>

    <button id="resetBtn" title="Làm mới lại toàn bộ 25 số">Đặt lại vòng quay</button>

    <!-- Màn hình hiệu ứng trúng thưởng -->
    <div class="overlay" id="overlay">
        <canvas id="explosionCanvas"></canvas>

        <!-- Giai đoạn 1: Hình tròn chứa số -->
        <div id="circleStage" style="display: flex; flex-direction: column; align-items: center;">
            <div class="winning-circle" id="winningCircle">
                <span class="winning-number" id="winningNumber">0</span>
            </div>
            <div class="click-hint">👆 Chạm vào con số để mở quà!</div>
        </div>

        <!-- Giai đoạn 2: Hình ảnh món quà -->
        <div class="gift-reveal" id="giftReveal">
            <img src="" alt="Quà tặng" class="gift-image" id="giftImage">
            <div class="gift-title" id="giftTitle">Quà số 1</div>
            <button class="close-gift-btn" id="closeGiftBtn">Tiếp tục lượt quay</button>
        </div>
    </div>

    <script>
        // =========================================================================
        // CẤU HÌNH DANH SÁCH 25 MÓN QUÀ TẠI ĐÂY
        // Thay đường link ảnh của bạn vào phần 'image' và tên quà vào 'name'
        // =========================================================================
        const GIFTS = {
            1:  { name: "Phần quà số 1",  image: "https://placehold.co/500x500/f59e0b/1e1b4b?text=Qua+So+1" },
            2:  { name: "Phần quà số 2",  image: "https://placehold.co/500x500/ec4899/ffffff?text=Qua+So+2" },
            3:  { name: "Phần quà số 3",  image: "https://placehold.co/500x500/3b82f6/ffffff?text=Qua+So+3" },
            4:  { name: "Phần quà số 4",  image: "https://placehold.co/500x500/10b981/ffffff?text=Qua+So+4" },
            5:  { name: "Phần quà số 5",  image: "https://placehold.co/500x500/8b5cf6/ffffff?text=Qua+So+5" },
            6:  { name: "Phần quà số 6",  image: "https://placehold.co/500x500/f43f5e/ffffff?text=Qua+So+6" },
            7:  { name: "Phần quà số 7",  image: "https://placehold.co/500x500/eab308/1e1b4b?text=Qua+So+7" },
            8:  { name: "Phần quà số 8",  image: "https://placehold.co/500x500/06b6d4/ffffff?text=Qua+So+8" },
            9:  { name: "Phần quà số 9",  image: "https://placehold.co/500x500/f97316/ffffff?text=Qua+So+9" },
            10: { name: "Phần quà số 10", image: "https://placehold.co/500x500/6366f1/ffffff?text=Qua+So+10" },
            11: { name: "Phần quà số 11", image: "https://placehold.co/500x500/14b8a6/ffffff?text=Qua+So+11" },
            12: { name: "Phần quà số 12", image: "https://placehold.co/500x500/d946ef/ffffff?text=Qua+So+12" },
            13: { name: "Phần quà số 13", image: "https://placehold.co/500x500/84cc16/1e1b4b?text=Qua+So+13" },
            14: { name: "Phần quà số 14", image: "https://placehold.co/500x500/ef4444/ffffff?text=Qua+So+14" },
            15: { name: "Phần quà số 15", image: "https://placehold.co/500x500/0ea5e9/ffffff?text=Qua+So+15" },
            16: { name: "Phần quà số 16", image: "https://placehold.co/500x500/a855f7/ffffff?text=Qua+So+16" },
            17: { name: "Phần quà số 17", image: "https://placehold.co/500x500/22c55e/ffffff?text=Qua+So+17" },
            18: { name: "Phần quà số 18", image: "https://placehold.co/500x500/f59e0b/1e1b4b?text=Qua+So+18" },
            19: { name: "Phần quà số 19", image: "https://placehold.co/500x500/ec4899/ffffff?text=Qua+So+19" },
            20: { name: "Phần quà số 20", image: "https://placehold.co/500x500/3b82f6/ffffff?text=Qua+So+20" },
            21: { name: "Phần quà số 21", image: "https://placehold.co/500x500/10b981/ffffff?text=Qua+So+21" },
            22: { name: "Phần quà số 22", image: "https://placehold.co/500x500/8b5cf6/ffffff?text=Qua+So+22" },
            23: { name: "Phần quà số 23", image: "https://placehold.co/500x500/f43f5e/ffffff?text=Qua+So+23" },
            24: { name: "Phần quà số 24", image: "https://placehold.co/500x500/eab308/1e1b4b?text=Qua+So+24" },
            25: { name: "Phần quà số 25", image: "https://placehold.co/500x500/06b6d4/ffffff?text=Qua+So+25" }
        };

        // Quản lý danh sách số chưa quay (tự động loại bỏ số đã trúng để không bị trùng)
        let availableNumbers = Array.from({ length: 25 }, (_, i) => i + 1);
        let currentWinner = null;
        let isSpinning = false;
        let isExploding = false;

        // Các phần tử DOM
        const numberDisplay = document.getElementById('numberDisplay');
        const spinRing = document.getElementById('spinRing');
        const spinBtn = document.getElementById('spinBtn');
        const resetBtn = document.getElementById('resetBtn');
        const statusText = document.getElementById('statusText');
        const overlay = document.getElementById('overlay');
        const circleStage = document.getElementById('circleStage');
        const winningCircle = document.getElementById('winningCircle');
        const winningNumber = document.getElementById('winningNumber');
        const giftReveal = document.getElementById('giftReveal');
        const giftImage = document.getElementById('giftImage');
        const giftTitle = document.getElementById('giftTitle');
        const closeGiftBtn = document.getElementById('closeGiftBtn');

        function updateStatus() {
            statusText.textContent = `Còn lại: ${availableNumbers.length} / 25 phần quà`;
            if (availableNumbers.length === 0) {
                spinBtn.disabled = true;
                spinBtn.textContent = "ĐÃ HẾT QUÀ";
            } else {
                spinBtn.disabled = false;
                spinBtn.textContent = "QUAY SỐ";
            }
        }

        // Bấm nút QUAY SỐ
        spinBtn.addEventListener('click', () => {
            if (isSpinning || availableNumbers.length === 0) return;

            isSpinning = true;
            spinBtn.disabled = true;
            spinRing.classList.add('active');

            // Chọn ngẫu nhiên 1 số trong các số còn lại
            const randomIndex = Math.floor(Math.random() * availableNumbers.length);
            currentWinner = availableNumbers[randomIndex];

            // Hiệu ứng chạy số ngẫu nhiên
            let duration = 2500; // Quay trong 2.5 giây
            let intervalTime = 50;
            let elapsed = 0;

            const spinInterval = setInterval(() => {
                const tempNum = availableNumbers[Math.floor(Math.random() * availableNumbers.length)];
                numberDisplay.textContent = tempNum;
                elapsed += intervalTime;

                if (elapsed >= duration) {
                    clearInterval(spinInterval);
                    finishSpin(randomIndex);
                }
            }, intervalTime);
        });

        function finishSpin(winnerIndex) {
            isSpinning = false;
            spinRing.classList.remove('active');
            numberDisplay.textContent = currentWinner;

            // Xóa số đã trúng khỏi danh sách chờ
            availableNumbers.splice(winnerIndex, 1);
            updateStatus();

            // Hiển thị số trúng thật to trong hình tròn ở giữa màn hình
            setTimeout(() => {
                winningNumber.textContent = currentWinner;
                winningCircle.classList.remove('wobble-effect');
                circleStage.style.display = 'flex';
                giftReveal.classList.remove('show');
                isExploding = false;
                overlay.classList.add('show');
            }, 400);
        }

        // Ấn vào con số -> Lắc lư -> Nổ tung -> Hiện quà
        winningCircle.addEventListener('click', () => {
            if (isExploding) return;
            isExploding = true;

            // Kích hoạt hiệu ứng lắc lư
            winningCircle.classList.add('wobble-effect');

            // Đợi lắc lư xong (650ms) thì kích hoạt nổ tung và hiện quà
            setTimeout(() => {
                triggerExplosion();
                circleStage.style.display = 'none';

                const gift = GIFTS[currentWinner];
                giftImage.src = gift.image;
                giftTitle.textContent = `Số ${currentWinner}: ${gift.name}`;
                giftReveal.classList.add('show');
            }, 650);
        });

        // Đóng bảng quà để quay lượt tiếp theo
        closeGiftBtn.addEventListener('click', () => {
            overlay.classList.remove('show');
            numberDisplay.textContent = "?";
        });

        // Nút làm mới lại từ đầu
        resetBtn.addEventListener('click', () => {
            if (confirm("Bạn có chắc muốn đặt lại toàn bộ 25 số để quay lại từ đầu?")) {
                availableNumbers = Array.from({ length: 25 }, (_, i) => i + 1);
                numberDisplay.textContent = "?";
                updateStatus();
            }
        });

        // =========================================================================
        // HIỆU ỨNG HẠT NỔ TUNG (PARTICLE EXPLOSION)
        // =========================================================================
        const canvas = document.getElementById('explosionCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function triggerExplosion() {
            particles = [];
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const colors = ['#facc15', '#f97316', '#ef4444', '#ec4899', '#38bdf8', '#ffffff'];

            for (let i = 0; i < 140; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 14 + 4;
                particles.push({
                    x: centerX,
                    y: centerY,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: Math.random() * 8 + 3,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    alpha: 1,
                    decay: Math.random() * 0.02 + 0.015
                });
            }
            animateParticles();
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let activeParticles = false;

            for (let p of particles) {
                if (p.alpha > 0) {
                    activeParticles = true;
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.25; // Trọng lực rơi nhẹ
                    p.alpha -= p.decay;

                    ctx.save();
                    ctx.globalAlpha = Math.max(0, p.alpha);
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.fill();
                    ctx.restore();
                }
            }

            if (activeParticles) {
                requestAnimationFrame(animateParticles);
            }
        }
    </script>
</body>
</html>
