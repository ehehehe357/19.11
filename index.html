<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vòng Quay May Mắn</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background: #fef7dc;
            color: #1e293b;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        h1 {
            position: absolute;
            top: 30px;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #6091ff;
        }

        /* Khu vực hiển thị số quay */
        .wheel-container {
            position: relative;
            width: 300px;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 40px;
        }

        .number-display {
            font-size: 9rem;
            font-weight: 900;
            color: #fc77b5;
        }

        .spinning-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 8px dashed rgba(252, 119, 181, 0.3);
            pointer-events: none;
        }

        .spinning-ring.active {
            animation: spinRing 1s linear infinite;
            border-color: #fc77b5;
        }

        @keyframes spinRing {
            100% { transform: rotate(360deg); }
        }

        /* Nút bấm */
        .controls {
            display: flex;
            gap: 15px;
            z-index: 10;
        }

        button {
            padding: 16px 45px;
            font-size: 1.3rem;
            font-weight: bold;
            text-transform: uppercase;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        #spinBtn {
            background: #6091ff;
            color: #fef7dc;
            box-shadow: none;
        }

        #spinBtn:hover:not(:disabled) {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        #spinBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #resetBtn {
            background: rgba(96, 145, 255, 0.15);
            color: #6091ff;
            font-size: 0.9rem;
            padding: 10px 20px;
            position: absolute;
            bottom: 20px;
            right: 20px;
        }

        #resetBtn:hover {
            background: rgba(96, 145, 255, 0.3);
        }

        .status-text {
            margin-top: 15px;
            color: #64748b;
            font-size: 1rem;
            font-weight: 600;
        }

        /* Màn hình Overlay khi trúng số */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .overlay.show {
            display: flex;
            animation: fadeIn 0.3s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Hình tròn chứa số ở chính giữa màn hình (Nền #6091ff, số #fef7dc) */
        .winning-circle {
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background: #6091ff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            animation: floatWobble 2s ease-in-out infinite;
        }

        @keyframes floatWobble {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(2deg); }
        }

        .winning-number {
            font-size: 10rem;
            font-weight: 900;
            color: #fef7dc;
            line-height: 1;
        }

        /* Hiệu ứng vỡ hình tròn khi click */
        .break-effect {
            animation: breakCircle 0.6s ease-in-out forwards !important;
        }

        @keyframes breakCircle {
            0% { transform: scale(1) rotate(0deg); opacity: 1; }
            40% { transform: scale(1.2) rotate(-10deg); }
            100% { transform: scale(0) rotate(20deg); opacity: 0; }
        }

        /* Hộp hiển thị món quà sau khi vỡ (Hình vuông viền #fc77b5) */
        .gift-reveal {
            display: none;
            flex-direction: column;
            align-items: center;
            text-align: center;
            background: #ffffff;
            padding: 30px;
            border-radius: 20px;
            border: 4px solid #fc77b5;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            max-width: 90%;
            z-index: 105;
        }

        .gift-reveal.show {
            display: flex;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0.3); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .gift-image {
            width: 300px;
            height: 300px;
            object-fit: cover;
            border-radius: 12px;
            border: 2px solid #e2e8f0;
            margin-bottom: 15px;
            background: #f8fafc;
        }

        .gift-title {
            font-size: 1.8rem;
            font-weight: bold;
            color: #1e293b;
            margin-bottom: 5px;
        }

        .gift-note {
            font-size: 0.9rem;
            color: #64748b;
            font-style: italic;
            margin-bottom: 20px;
        }

        .close-gift-btn {
            background: #fc77b5;
            color: #fef7dc;
            padding: 12px 35px;
            font-size: 1.1rem;
            border-radius: 30px;
        }

        .close-gift-btn:hover {
            opacity: 0.9;
            transform: scale(1.03);
        }

        #explosionCanvas {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 102;
        }
    </style>
</head>
<body>

    <h1>Vòng Quay May Mắn</h1>

    <div class="wheel-container">
        <div class="spinning-ring" id="spinRing"></div>
        <div class="number-display" id="numberDisplay">01</div>
    </div>

    <div class="controls">
        <button id="spinBtn">QUAY SỐ</button>
    </div>
    <div class="status-text" id="statusText">Còn lại: 13 / 13 phần quà</div>

    <button id="resetBtn" title="Đặt lại toàn bộ 13 số">Đặt lại vòng quay</button>

    <!-- Màn hình Overlay kết quả -->
    <div class="overlay" id="overlay">
        <canvas id="explosionCanvas"></canvas>

        <!-- Giai đoạn 1: Hình tròn chứa số -->
        <div id="circleStage" style="display: flex; flex-direction: column; align-items: center;">
            <div class="winning-circle" id="winningCircle">
                <span class="winning-number" id="winningNumber">01</span>
            </div>
        </div>

        <!-- Giai đoạn 2: Khung hình vuông chứa quà -->
        <div class="gift-reveal" id="giftReveal">
            <img src="" alt="Quà tặng" class="gift-image" id="giftImage">
            <div class="gift-title" id="giftTitle">Món quà số 01</div>
            <div class="gift-note">Hình ảnh chỉ mang tính chất minh họa</div>
            <button class="close-gift-btn" id="closeGiftBtn">Tiếp tục lượt quay</button>
        </div>
    </div>

    <script>
        // Danh sách 13 món quà liên kết với thư mục S (đổi .jpg thành .png nếu ảnh của bạn là png)
        const GIFTS = {
            1:  { name: "Món quà số 01", image: "S/01.png" },
            2:  { name: "Món quà số 02", image: "S/02.jpg" },
            3:  { name: "Món quà số 03", image: "S/03.jpg" },
            4:  { name: "Món quà số 04", image: "S/04.jpeg" },
            5:  { name: "Món quà số 05", image: "S/05.jpg" },
            6:  { name: "Món quà số 06", image: "S/06.jpg" },
            7:  { name: "Món quà số 07", image: "S/07.jpg" },
            8:  { name: "Món quà số 08", image: "S/08.jpg" },
            9:  { name: "Món quà số 09", image: "S/09.jpg" },
            10: { name: "Món quà số 10", image: "S/10.jpg" },
            11: { name: "Món quà số 11", image: "S/11.jpg" },
            12: { name: "Món quà số 12", image: "S/12.jpg" },
            13: { name: "Món quà số 13", image: "S/13.jpg" }
        };

        // Hàm hỗ trợ thêm số 0 đằng trước cho các số từ 1-9
        function formatNumber(num) {
            return num < 10 ? '0' + num : num;
        }

        let availableNumbers = Array.from({ length: 13 }, (_, i) => i + 1);
        let currentWinner = null;
        let isSpinning = false;
        let isBreaking = false;
        let duration = 1600;

        const numberDisplay = document.getElementById('numberDisplay');
        const spinRing = document.getElementById('spinRing');
        const spinBtn = document.getElementById('spinBtn');
        const resetBtn = document.getElementById('resetBtn');
        const statusText = document.getElementById('statusText');
        const overlay = document.getElementById('overlay');
        const circleStage = document.getElementById('circleStage');
        const winningCircle = document.getElementById('winningCircle');
        const winningNumber = document.getElementById('winningNumber');
        const giftReveal = document.getElementById('giftReveal');
        const giftImage = document.getElementById('giftImage');
        const giftTitle = document.getElementById('giftTitle');
        const closeGiftBtn = document.getElementById('closeGiftBtn');

        function updateStatus() {
            statusText.textContent = `Còn lại: ${availableNumbers.length} / 13 phần quà`;
            if (availableNumbers.length === 0) {
                spinBtn.disabled = true;
                spinBtn.textContent = "ĐÃ HẾT QUÀ";
            } else {
                spinBtn.disabled = false;
                spinBtn.textContent = "QUAY SỐ";
            }
        }

        // Bấm nút QUAY SỐ
        spinBtn.addEventListener('click', () => {
            if (isSpinning || availableNumbers.length === 0) return;

            isSpinning = true;
            spinBtn.disabled = true;
            spinRing.classList.add('active');

            const randomIndex = Math.floor(Math.random() * availableNumbers.length);
            currentWinner = availableNumbers[randomIndex];

            let intervalTime = 50;
            let elapsed = 0;

            const spinInterval = setInterval(() => {
                const tempNum = availableNumbers[Math.floor(Math.random() * availableNumbers.length)];
                numberDisplay.textContent = formatNumber(tempNum);
                elapsed += intervalTime;

                if (elapsed >= duration) {
                    clearInterval(spinInterval);
                    finishSpin(randomIndex);
                }
            }, intervalTime);
        });

        function finishSpin(winnerIndex) {
            isSpinning = false;
            spinRing.classList.remove('active');
            numberDisplay.textContent = formatNumber(currentWinner);

            availableNumbers.splice(winnerIndex, 1);
            updateStatus();

            setTimeout(() => {
                winningNumber.textContent = formatNumber(currentWinner);
                winningCircle.classList.remove('break-effect');
                circleStage.style.display = 'flex';
                giftReveal.classList.remove('show');
                isBreaking = false;
                overlay.classList.add('show');
            }, 300);
        }

        // Ấn vào hình tròn chứa số -> Vỡ ra -> Hiện quà
        winningCircle.addEventListener('click', () => {
            if (isBreaking) return;
            isBreaking = true;

            winningCircle.classList.add('break-effect');
            triggerExplosion();

            setTimeout(() => {
                circleStage.style.display = 'none';

                const gift = GIFTS[currentWinner];
                giftImage.src = gift.image;
                giftTitle.textContent = `Món quà số ${formatNumber(currentWinner)}`;
                giftReveal.classList.add('show');
            }, 500);
        });

        // Đóng bảng quà để quay tiếp
        closeGiftBtn.addEventListener('click', () => {
            overlay.classList.remove('show');
            numberDisplay.textContent = "01";
        });

        // Nút đặt lại từ đầu
        resetBtn.addEventListener('click', () => {
            if (confirm("Bạn có chắc muốn đặt lại toàn bộ 13 số để quay lại từ đầu?")) {
                availableNumbers = Array.from({ length: 13 }, (_, i) => i + 1);
                numberDisplay.textContent = "01";
                updateStatus();
            }
        });

        // Hiệu ứng pháo hoa hạt nhỏ khi vỡ hình tròn
        const canvas = document.getElementById('explosionCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function triggerExplosion() {
            particles = [];
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const colors = ['#fc77b5', '#6091ff', '#fef7dc', '#ff99c8', '#a3c1ad'];

            for (let i = 0; i < 100; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 12 + 3;
                particles.push({
                    x: centerX,
                    y: centerY,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: Math.random() * 6 + 2,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    alpha: 1,
                    decay: Math.random() * 0.02 + 0.015
                });
            }
            animateParticles();
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let activeParticles = false;

            for (let p of particles) {
                if (p.alpha > 0) {
                    activeParticles = true;
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.2;
                    p.alpha -= p.decay;

                    ctx.save();
                    ctx.globalAlpha = Math.max(0, p.alpha);
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.fill();
                    ctx.restore();
                }
            }

            if (activeParticles) {
                requestAnimationFrame(animateParticles);
            }
        }
    </script>
</body>
</html>
